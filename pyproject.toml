[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mmirage"
version = "0.1.4"
description = "Modular Multimodal Intelligent Reformatting and Augmentation Generation Engine - Advanced platform for processing datasets using generative models including vision-language models."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Meditron team" }]

dependencies = [
  "transformers==5.3.0",
  "pyzmq==27.1.0",
  "uvloop==0.21.0; platform_system != 'Windows'",
  "fastapi==0.136.1",
  "partial-json-parser==0.2.1.1.post7",
  "sentencepiece==0.2.1",
  "msgspec==0.21.1",
  "nest-asyncio==1.6.0",
  "pyyaml==6.0.3",
  "json-repair==0.59.8",
  "tqdm==4.67.3",
  "datasets==4.8.5",
  "pyarrow==24.0.0",
  "huggingface-hub==1.14.0",
  "numpy==2.3.5",
  "fsspec==2026.2.0",
  "dacite==1.9.2",
  "pydantic==2.13.4",
  "jmespath==1.1.0",
  "jinja2==3.1.6",
  "pillow==12.1.1",
  "typing-extensions==4.15.0",
  "humanize==4.15.0",
  "openai==2.6.1",
  "anthropic>=0.111.0,<1.0",
  "pebble==5.2.0",
]

[project.optional-dependencies]
gpu = [
  "sglang==0.5.10",
  "sgl-kernel==0.3.21",
  "xgrammar==0.1.32",
  "compressed-tensors==0.15.0.1",
]

dev = [
  "ruff>=0.16",
  "pre-commit>=4.0",
  "pyright>=1.1",
  "ipykernel",
  "pytest",
]
image_gen = [
  "sglang[diffusion]==0.5.10",
]

[project.scripts]
mmirage = "mmirage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mmirage"]

[tool.hatch.build.targets.sdist]
include = ["src/mmirage/**", "pyproject.toml", "README.md"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Sphinx conf.py adjusts sys.path before imports
"docs/conf.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src/mmirage"]
# sglang is not installed in CI; a missing import is a warning, not an error.
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
# Known type errors; later cleanup PRs remove files from this list one at a time.
ignore = [
  "src/mmirage/core/process/batch/openai_adapter.py",
  "src/mmirage/core/process/batch/orchestrator.py",
  "src/mmirage/core/process/mapper.py",
  "src/mmirage/core/process/processors/batch_api/batch_api_processor.py",
  "src/mmirage/core/process/processors/custom/custom_processor.py",
  "src/mmirage/core/process/processors/image_gen/backends/sglang_backend.py",
  "src/mmirage/core/process/processors/image_gen/image_gen_processor.py",
  "src/mmirage/core/process/processors/llm/llm_processor.py",
  "src/mmirage/shard_process.py",
]
